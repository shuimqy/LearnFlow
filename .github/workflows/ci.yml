name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm run typecheck

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: learnflow
          POSTGRES_PASSWORD: ci_database
          POSTGRES_DB: learnflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U learnflow -d learnflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://learnflow:ci_database@127.0.0.1:5432/learnflow_test
      TEST_DATABASE_URL: postgresql+psycopg://learnflow:ci_database@127.0.0.1:5432/learnflow_test
      MANAGE_LOCAL_POSTGRES: "false"
      LLM_API_KEY: ""
      EMBEDDING_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --all-packages
      - run: uv run --locked --all-packages ruff check backend scripts
      - run: uv run --locked --all-packages ruff format --check backend scripts
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: sudo apt-get install --yes fonts-noto-cjk
      - run: uv run --locked --all-packages pytest -q

  launcher:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test scripts/service-host.test.mjs
