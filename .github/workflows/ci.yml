name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql+psycopg://learnflow:ci_database@127.0.0.1:55432/learnflow
      TEST_DATABASE_URL: postgresql+psycopg://learnflow:ci_database@127.0.0.1:55432/learnflow_test
      MANAGE_LOCAL_POSTGRES: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      LLM_API_KEY: ""
      EMBEDDING_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --all-packages
      - run: uv run --locked --all-packages ruff check backend scripts
      - run: uv run --locked --all-packages ruff format --check backend scripts
      - run: npm.cmd ci
        working-directory: frontend
      - run: npm.cmd run format:check
        working-directory: frontend
      - run: npm.cmd run build
        working-directory: frontend
      - run: npm.cmd run typecheck
        working-directory: frontend
      - run: node --test scripts/service-host.test.mjs
      - run: uv run --locked --all-packages python -m app.cli.database setup
      - run: uv run --locked --all-packages pytest -q
      - run: npm.cmd run test:e2e:personal
        working-directory: frontend
      - if: always()
        run: uv run --locked --all-packages python -m app.cli.database stop
